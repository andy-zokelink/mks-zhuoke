<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750"
     style="background: #1a1612; font-family: 'PingFang SC','Microsoft YaHei',sans-serif;">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(212,160,64,0.06)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="1000" height="750" fill="#1a1612"/>
  <rect width="1000" height="750" fill="url(#bg-glow)"/>

  <!-- Title -->
  <text x="500" y="36" text-anchor="middle" font-size="20" fill="#f0e8d8" font-weight="700"
