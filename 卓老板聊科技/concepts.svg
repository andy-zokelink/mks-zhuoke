  <text x="500" y="58" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.35)"
        font-style="italic">298 篇文章的跨领域概念关联</text>

  <!-- Edges -->
  
    <!-- 元素→生命 -->
    <path d="M 500,120 Q 375.0,205.0 250,350"
