  <!-- Legend -->
  <rect x="30" y="680" width="10" height="10" rx="2" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="48" y="690" font-size="11" fill="rgba(255,255,255,0.3)" font-family="PingFang SC, Microsoft YaHei, sans-serif">概念关联</text>

  <circle cx="200" cy="685" r="4" fill="#1a1612" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <text x="212" y="690" font-size="11" fill="rgba(255,255,255,0.3)" font-family="PingFang SC, Microsoft YaHei, sans-serif">知识专题</text>

  <text x="500" y="730" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.15)"
